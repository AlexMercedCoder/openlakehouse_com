<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="odl-arch-title odl-arch-desc">
  <title id="odl-arch-title">Open lakehouse reference architecture</title>
  <desc id="odl-arch-desc">Nine layers of an open lakehouse, drawn bottom to top in the order the stack is assembled. Layer 1, Foundations: What kind of system are we building? Examples: Lakehouse, Data lake, Data warehouse, Medallion. Layer 2, Storage format: How is the data physically written down? Examples: Apache Parquet, ORC, Avro, Object storage. Layer 3, Table format: What makes those files behave like a table? Examples: Apache Iceberg, Delta Lake, Apache Hudi, Apache Paimon. Layer 4, Catalog: How do engines find and govern those tables? Examples: Apache Polaris, Iceberg REST, Nessie, Glue, Unity. Layer 5, Compute: What actually runs the query? Examples: Spark, Trino, Flink, DuckDB, Dremio. Layer 6, Interchange: How does data move between systems? Examples: Apache Arrow, Arrow Flight, Flight SQL. Layer 7, Movement: How does data get in, and stay current? Examples: Airflow, dbt, Dagster, CDC, Streaming. Layer 8, Semantics: What does this data mean? Examples: Semantic layer, Metrics, Ontology, Modeling. Layer 9, Agents &amp; AI: How do agents use any of this safely? Examples: Agentic analytics, RAG, Text-to-SQL, Vector search. Diagram by Alex Merced, opendatalakehouse.com, licensed CC BY 4.0.</desc>
